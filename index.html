<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Interactive World Map</title>
<link href="map.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #map-container { width: 100%; min-height: 400px; }
  #diag { font: 13px/1.6 monospace; padding: 12px; background: #fff8e1;
          border-bottom: 2px solid #ffb300; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="diag">Waiting…</div>
<div id="map-container"></div>

<script src="raphael.min.js"></script>
<script src="settings.js"></script>
<script src="paths.js"></script>
<script src="map.js"></script>
<script>
var d = document.getElementById('diag');
var log = [];
log.push('immediately after scripts: FlaMap is ' + (typeof FlaMap));

window.addEventListener('load', function () {
  log.push('at window.load:            FlaMap is ' + (typeof FlaMap));
  setTimeout(function () {
    log.push('2 seconds after load:      FlaMap is ' + (typeof FlaMap));
    if (typeof FlaMap === 'function') {
      try {
        new FlaMap(map_cfg).drawOnDomReady('map-container');
        log.push('>>> DREW THE MAP OK <<<');
      } catch (e) { log.push('>>> init threw: ' + e.message); }
    } else {
      log.push('>>> FlaMap never appears — licence gate confirmed <<<');
    }
    d.textContent = log.join('\n');
  }, 2000);
});
d.textContent = log.join('\n');
</script>

</body>
</html>
