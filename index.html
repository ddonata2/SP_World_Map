<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Interactive World Map</title>
<link href="map.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #map-container, #map, #world-map { width: 100%; min-height: 400px; }
  #diag { font: 13px/1.6 monospace; padding: 12px; background: #fff8e1;
          border-bottom: 2px solid #ffb300; white-space: pre-wrap; }
</style>
</head>
<body>

<div id="diag">Loading…</div>

<div id="map-container"></div>
<div id="map"></div>
<div id="world-map"></div>

<script>var __before = Object.keys(window);</script>
<script src="raphael.min.js"></script>
<script src="settings.js"></script>
<script src="paths.js"></script>
<script src="map.js"></script>
<script>
(function () {
  var out = [];
  var added = Object.keys(window).filter(function (k) {
    return __before.indexOf(k) === -1 && k !== '__before';
  });
  out.push('=== NEW GLOBALS ADDED BY THE SCRIPTS ===');
  added.forEach(function (k) {
    var t; try { t = typeof window[k]; } catch (e) { t = '?'; }
    out.push('  ' + k + '   [' + t + ']');
  });
  out.push('');
  out.push('=== GLOBALS MATCHING map/fla/world/draw ===');
  Object.keys(window).filter(function (k) {
    return /map|fla|world|draw/i.test(k);
  }).forEach(function (k) {
    var t; try { t = typeof window[k]; } catch (e) { t = '?'; }
    out.push('  ' + k + '   [' + t + ']');
  });
  out.push('');
  out.push('=== METHODS ON MAP-ISH OBJECTS ===');
  Object.keys(window).filter(function (k) {
    return /map|fla/i.test(k) && window[k] && typeof window[k] === 'object';
  }).forEach(function (k) {
    try { out.push('  ' + k + ': ' + Object.keys(window[k]).slice(0, 25).join(', ')); } catch (e) {}
  });
  out.push('');
  out.push('=== CONTAINER CONTENTS ===');
  ['map-container', 'map', 'world-map'].forEach(function (id) {
    var el = document.getElementById(id);
    out.push('  #' + id + ': ' + (el ? el.innerHTML.length + ' chars inside' : 'missing'));
  });
  document.getElementById('diag').textContent = out.join('\n');
})();
</script>

</body>
</html>
